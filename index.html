<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkerboard</title>
    <style>
        #board {
            display: grid;
            grid-template-columns: repeat(8, 50px);
            border: 2px solid #737373;
        }

        .square {
            width: 50px;
            height: 50px;
        }

        .light {
            background-color: white;
        }

        .dark {
            background-color: black;
        }
    </style>
</head>
<body>
    <h1>Checkerboard 8×8</h1>
    <div id="board"></div>

    <script type="module" src="chequerboord.js"></script>
</body>
</html>
